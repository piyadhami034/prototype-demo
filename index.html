<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fake News Detector</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <div class="card">
    <h1>🧠 Fake News Detector</h1>
    <p>AI-powered verification for news</p>
    <button onclick="goToPage2()">Start Analysis</button>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page hidden">
  <div class="card">
    <h2>Paste News</h2>
    <textarea id="inputText" placeholder="Enter news headline or content..."></textarea>
    <button onclick="analyze()">Analyze</button>
  </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page hidden">
  <div class="card">

    <h2>Analysis Result</h2>

    <div id="loader" class="loader"></div>

    <p id="result"></p>
    <p id="confidenceText"></p>
    <p id="explanation"></p>

    <!-- progress -->
    <div class="progress-container">
      <div id="progressBar"></div>
    </div>

    <!-- sources -->
    <div id="sources" class="sources"></div>

    <button onclick="goToPage1()">Analyze Again</button>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
